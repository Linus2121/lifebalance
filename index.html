<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070e12">
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<a class="skip" href="#app">Skip to content</a>
<header class="top">

</header>
<nav id="tabs" class="tabs" aria-label="Main"></nav>
<div id="demoBar" class="demo" hidden></div>

<main id="app" class="wrap" tabindex="-1"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<footer>Powered by Lamb Technologies<br><span class="small">Last updated 2026-10-29 · Your data stays on this device</span></footer>

<script src="js/merge.js"></script>
